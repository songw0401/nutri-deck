name: Nutri-Deck CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate game data
        run: python data/pipeline/validate_game_foods.py

      - name: Import FastAPI app
        working-directory: backend
        run: python -c "from app.main import app; print(app.title)"

      - name: Compile data sync modules
        run: python -m py_compile backend/app/main.py backend/app/services/public_data_sync.py data/pipeline/sync_menuzen.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build
